[project]
name = "numerical-wave-tank"
version = "0.1.0"
description = "Numerical Wave Tank — linear Airy wave generation, JONSWAP sea states, and spectral analysis"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4",
    "matplotlib>=3.10",
    "pillow>=12.0",
    "ipykernel>=7.0",
    "jupyter>=1.0",
]

[dependency-groups]
dev = [
    "isort>=8.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wave_tank", "src/spectrum", "src/export"]
